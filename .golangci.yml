version: "2"
run:
  tests: false
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - forcetypeassert
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nakedret
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      min-occurrences: 10
    gocritic:
      disabled-checks:
        - exitAfterDefer
    gosec:
      excludes:
        - G115
        - G101
    staticcheck:
      checks:
        - all
        - -QF1008
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dogsled
          - errcheck
          - goconst
          - gocritic
          - gosec
          - staticcheck
          - unparam
          - unused
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^test/
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^test/
